name: Generate SVGs for Stocks
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-svgs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stock: 
          - 'RELIANCE.NS'
          - 'TATAMOTORS.NS'
          - 'INFY.NS'
          - 'HDFCBANK.NS'
          - 'TCS.NS'
          - 'ICICIBANK.NS'
          - 'HINDUNILVR.NS'
          - 'SBIN.NS'
          - 'BHARTIARTL.NS'
          - 'ASIANPAINT.NS'
          - 'BAJFINANCE.NS'
      # Run jobs one after another
      max-parallel: 1
    steps:
    - name: Checkout code
      # Use clean checkout for each job to avoid unstaged changes
      uses: actions/checkout@v3
      with:
        # Fetch all history for all branches and tags
        fetch-depth: 0
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance
        
    - name: Generate SVG for ${{ matrix.stock }}
      run: |
        mkdir -p svgs
        python generate_svgs.py ${{ matrix.stock }}
        
    - name: List generated SVGs
      run: ls -l svgs
      
    - name: Upload SVG file as artifact
      uses: actions/upload-artifact@v4
      with:
        name: svg-${{ matrix.stock }}
        path: svgs/${{ matrix.stock }}.svg
        
    - name: Configure Git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
    - name: Commit and push SVG files
      run: |
        # Ensure we're on the main branch with latest changes
        git fetch origin
        git checkout main
        git pull origin main
        
        # Check if the file exists to avoid re-adding files from previous runs
        if [ -f "svgs/${{ matrix.stock }}.svg" ]; then
          git add svgs/${{ matrix.stock }}.svg
          git commit -m "Add SVG for ${{ matrix.stock }}" || echo "No changes to commit"
          
          # Try to push, with retry logic in case of conflicts
          for i in {1..5}; do
            echo "Push attempt $i..."
            git pull --rebase origin main
            if git push origin main; then
              echo "Push successful!"
              break
            else
              echo "Push failed, retrying in 5 seconds..."
              sleep 5
            fi
          done
        else
          echo "SVG file not found!"
          exit 1
        fi
        
    - name: Sleep between runs to avoid rate limiting
      run: |
        # Sleep time to avoid rate limiting for API calls
        SLEEP_TIME=$((5 + RANDOM % 10))
        echo "Sleeping for $SLEEP_TIME seconds to avoid rate limiting..."
        sleep $SLEEP_TIME
