name: Generate SVGs for Stocks
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-svgs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stock: 
          - 'RELIANCE.NS'
          - 'TATAMOTORS.NS'
          - 'INFY.NS'
          - 'HDFCBANK.NS'
      # Add this to run jobs one after another instead of in parallel
      max-parallel: 1
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance
        
    - name: Generate SVG for ${{ matrix.stock }}
      run: |
        mkdir -p svgs
        python generate_svgs.py ${{ matrix.stock }}
        
    - name: List generated SVGs
      run: ls -l svgs
      
    - name: Upload SVG file as artifact
      uses: actions/upload-artifact@v4
      with:
        name: svg-${{ matrix.stock }}
        path: svgs/${{ matrix.stock }}.svg
        
    - name: Configure Git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
    - name: Commit and push SVG files
      run: |
        # Always pull latest changes before committing
        git pull origin main --rebase
        git add svgs/${{ matrix.stock }}.svg
        git commit -m "Add SVG for ${{ matrix.stock }}" || echo "No changes to commit"
        git push origin main
        
    - name: Sleep between runs to avoid rate limiting
      run: |
        # Sleep time to avoid rate limiting for API calls
        SLEEP_TIME=$((5 + RANDOM % 10))
        echo "Sleeping for $SLEEP_TIME seconds to avoid rate limiting..."
        sleep $SLEEP_TIME
