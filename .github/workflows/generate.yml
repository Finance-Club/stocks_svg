name: Daily Stock SVG Generator

on:
  schedule:
    - cron: '0 3 * * *'  # Runs every day at 3 AM UTC (8:30 AM IST)
  workflow_dispatch:      # le manual trigger :>

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate SVGs
        run: python generate_svgs.py

      - name: Commit and push if there are changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/img/*.svg
          git commit -m "🔁 Auto-update stock SVGs" || echo "No changes to commit"
          git push
