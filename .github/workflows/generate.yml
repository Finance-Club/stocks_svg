name: Generate SVGs for Stocks

on:
  workflow_dispatch:

jobs:
  generate-svgs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stock: 
          # This will be filled dynamically from the stocks.txt file
          # Using a placeholder stock as an example. I need to adjust this later.
          - 'RELIANCE.NS'
          - 'TATAMOTORS.NS'
          - 'INFY.NS'
          - 'HDFCBANK.NS'

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance

    - name: Generate SVG for ${{ matrix.stock }}
      run: |
        mkdir -p svgs
        python generate_svgs.py ${{ matrix.stock }}
    
    - name: Upload SVG file
      uses: actions/upload-artifact@v2
      with:
        name: svg-${{ matrix.stock }}
        path: svgs/${{ matrix.stock }}.svg

    - name: Sleep between runs (optional)
      run: sleep 5
